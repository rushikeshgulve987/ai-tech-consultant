<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knowledge Brain</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--card:#f5f5f7;--acc:#2f5bea;--warn:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#161618;--fg:#eee;--mut:#9a9a9a;--card:#232326;--acc:#7a9bff;--warn:#f0a43c}}
body{font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:760px;margin:0 auto;padding:1rem}
textarea{width:100%;box-sizing:border-box;padding:.6rem;font:inherit;background:var(--card);color:var(--fg);border:1px solid #8884;border-radius:8px}
button{background:var(--acc);color:#fff;border:0;padding:.55rem 1rem;border-radius:8px;font:inherit;cursor:pointer;margin-top:.5rem}
.card{background:var(--card);border-radius:10px;padding:1rem;margin-top:1rem}.mut{color:var(--mut);font-size:.9rem}.warn{color:var(--warn);font-weight:600}
a{color:var(--acc)} img{max-width:100%;border-radius:6px;margin-top:.4rem}
</style></head><body>
<h1>Knowledge Brain</h1>
<p class="mut">Ask a product question. Answers cite their sources; if the docs don't cover it, the question goes to a human expert.</p>
<textarea id="q" rows="3" placeholder="e.g. How do I issue a refund for a member payment?"></textarea>
<button id="ask">Ask</button> <span id="state" class="mut"></span>
<div id="out"></div>
<script>
const out=document.getElementById('out'),state=document.getElementById('state');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('ask').onclick=async()=>{
  const question=document.getElementById('q').value.trim(); if(question.length<3)return;
  state.textContent='Thinking…'; out.innerHTML='';
  try{
    const r=await fetch('/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});
    if(!r.ok){out.innerHTML=`<div class="card warn">Knowledge service error (${r.status}). Nothing was answered.</div>`;state.textContent='';return}
    const d=await r.json(); state.textContent='';
    if(d.status==='insufficient_evidence'){
      out.innerHTML=`<div class="card"><p class="warn">I don't have enough documented evidence to answer this.</p><p>A task was sent to a human expert (escalation #${esc(d.escalation_id??'-')}).</p><p class="mut">Reason: ${esc(d.note||'')}</p></div>`;return}
    out.innerHTML=`<div class="card"><p>${esc(d.answer).replace(/\n/g,'<br>')}</p>${d.note?`<p class="mut">Caveat: ${esc(d.note)}</p>`:''}
    <h4>Sources</h4><ul>${d.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a> <span class="mut">(${s.kind}, relevance ${s.relevance})</span></li>`).join('')}</ul>
    ${d.images.map(i=>`<div><img src="${esc(i.image_url)}" alt="${esc(i.description)}" loading="lazy"><div class="mut">${esc(i.description)}</div></div>`).join('')}</div>`;
  }catch(e){out.innerHTML='<div class="card warn">Could not reach the Knowledge service.</div>';state.textContent=''}
};
</script></body></html>
